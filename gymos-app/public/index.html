<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex">
<title>GymOS · Royal The Gym</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Royal Gym">
<link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
<div id="gate"></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><span class="crest"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg></span><div><b id="gymName">Royal The Gym</b><small>GymOS</small></div></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="foot"><b>Train like royalty</b>Shekhawati's finest fitness club</div>
  </aside>
  <div class="main">
    <header class="top">
      <span class="mbrand"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg>GymOS</span>
      <div class="date" id="date"></div>
      <span id="pills"></span>
      <span class="who" id="who"></span>
      <button class="btn sm" id="langBtn" type="button"></button>
      <button class="btn sm ibtn" id="themeBtn" type="button"></button>
      <button class="btn sm ibtn" id="pwBtn" type="button"></button>
      <button class="btn sm ibtn" id="outBtn" type="button"></button>
    </header>
    <main class="page" id="view"></main>
  </div>
</div>
<div id="modals"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript>GymOS needs JavaScript.</noscript>
<script src="app.js"></script>
</body>
</html>
