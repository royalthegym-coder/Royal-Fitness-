<html lang="en" class="dark">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {

                gold: '#d97706',

          }
        }

    <!-- Premium Fonts for Receipt & UI -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Fira+Code:wght@300;500&family=Great+Vibes&family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <script type="importmap">
{
  "imports": {

    "lib/": "./lib/",

    <script>
      // Using a setter to ensure process.env is handled by the platform injection
      window.process = window.process || { env: {}, cwd: () => '/' };

      // --- 5-LAYER QUANTUM SECURITY PROTOCOL ---
      document.addEventListener('contextmenu', event => event.preventDefault()); // Block Right Click
      document.addEventListener('keydown', (e) => {
        // Block F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
        if (e.key === 'F12' || 
           (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
           (e.ctrlKey && e.key === 'U')) {
          e.preventDefault();
          return false;
        }
      });
      // Anti-Debugger Loop
      setInterval(() => {
        const before = new Date().getTime();
        debugger;
        const after = new Date().getTime();
        if (after - before > 100) {
            document.body.innerHTML = "<div style='color:red; text-align:center; margin-top:20%; font-family:monospace; font-size:24px;'>SECURITY BREACH DETECTED. ACCESS DENIED.</div>";
        }
      }, 2000);
    </script>
    <style>
      :root {
        --royal-charcoal: #000000;
        --royal-gold: #d97706;
        --royal-gold-light: #fbbf24;
        --royal-orange: #ea580c;
        --glass-border: rgba(255, 255, 255, 0.08);
      }

      body {
        background-color: var(--royal-charcoal);
        font-family: 'Inter', sans-serif;
        color: #e5e7eb;
        /* Disable text selection globally for security */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        overscroll-behavior: none; /* Prevent pull-to-refresh on mobile */
      }
      /* Allow selection only in inputs */
      input, textarea {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }
      .font-display { font-family: 'Russo One', sans-serif; }
      .font-mono { font-family: 'Fira Code', monospace; }
      .font-signature { font-family: 'Great Vibes', cursive; }
      .font-serif-display { font-family: 'Cinzel', serif; }
      
      .receipt-paper {
        background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
        background-size: 20px 20px;
      }

      /* Holographic & Neon Effects */
      .neon-text {
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.3);
      }
      
      /* Window Opening Effect */
      .window-open-anim {
        animation: windowOpen 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center center;
        will-change: transform, opacity, clip-path;
      }

      @keyframes windowOpen {
        0% {
          opacity: 0;
          transform: scale(0.92);
          clip-path: inset(50% 0 50% 0);
          filter: blur(10px);
        }
        50% {
          opacity: 1;
          clip-path: inset(0 0 0 0);
        }
        100% {
          transform: scale(1);
          filter: blur(0);
        }
      }

      @keyframes check-pop {
        0% { transform: scale(0.5); opacity: 0; }
        50% { transform: scale(1.3); }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-neural-check {
        animation: check-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes tactical-glow {
        0% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.2); }
        50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }
        100% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.2); }
      }
      .tactical-glow {
        animation: tactical-glow 2s infinite ease-in-out;
      }

      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #000000; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--royal-gold); }

      /* Visual Launch Animations */
      @keyframes marquee {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
      .animate-marquee {
        animation: marquee 30s linear infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes scan {
        0% { top: 0; }
        100% { top: 100%; }
      }
      .animate-scan {
        animation: scan 3s linear infinite;
      }

      /* Checkmark Drawing Animation - Fixed Selector and Values */
      @keyframes draw-stroke {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      .animate-stroke {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw-stroke 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      
      /* Specific selector for Lucide icons often used inside buttons */
      .animate-stroke path, 
      .animate-stroke polyline, 
      .animate-stroke circle, 
      .animate-stroke line {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw-stroke 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

    </style>
