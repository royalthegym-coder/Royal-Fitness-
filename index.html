<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <script>
      // Apply the saved theme before first paint (no flash). Values: dark | light | system.
      (function () {
        try {
          var pref = localStorage.getItem('ff_theme') || 'dark';
          var light = pref === 'light' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          var el = document.documentElement;
          el.classList.toggle('light', light);
          el.classList.toggle('dark', !light);
        } catch (e) {}
      })();
    </script>
    <script>
      // Silence benign Vite HMR WebSocket notices in iframe preview
      window.addEventListener('unhandledrejection', (event) => {
        const reason = event.reason;
        if (reason) {
          const msg = typeof reason === 'string' ? reason : (reason.message || '');
          if (msg.toLowerCase().includes('websocket') || msg.toLowerCase().includes('vite')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }
      }, true);

      window.addEventListener('error', (event) => {
        const msg = event.message || '';
        if (msg.toLowerCase().includes('websocket') || msg.toLowerCase().includes('vite')) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Fitness Future — Complete Gym Management Software Suite" />
    <meta property="og:title" content="Fitness Future" />
    <meta property="og:description" content="Fitness Future — Complete Gym Management Software Suite" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fitness Future" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Fitness Future</title>
    <script>
      window.__vite_plugin_react_preamble_installed__ = true;
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.process = window.process || { env: {}, cwd: () => '/' };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="overflow-hidden m-0 p-0 bg-[#09090B] text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/lib/index.tsx"></script>
  </body>
</html>
